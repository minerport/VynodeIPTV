services:
  iptv:
    image: iptv-server:0.9.1
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "127.0.0.1:8580:8080"
    environment:
      IPTV_DEMO: "1"
      TZ: America/New_York
    volumes:
      - config:/config
      - transcode:/transcode
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  config:
    name: signal-iptv-config
  transcode:
    name: signal-iptv-transcode
